name: aigopushtg

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aigopushtg
      POSTGRES_USER: aigopushtg
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigopushtg -d aigopushtg"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
  migrate:
    build: .
    command: ["python", "-m", "app.storage.migrate"]
    env_file: .env
    environment:
      DATABASE_URL: $DATABASE_URL
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: aigopushtg
      PGPASSWORD: $POSTGRES_PASSWORD
      PGDATABASE: aigopushtg
    volumes:
      - ./backups:/backups
    command:
      - sh
      - -c
      - |
        mkdir -p /backups && chmod 700 /backups
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          tmp="/backups/aigopushtg-$$stamp.dump.tmp"
          out="/backups/aigopushtg-$$stamp.dump"
          if pg_dump -Fc -f "$$tmp" && mv "$$tmp" "$$out"; then
            chmod 600 "$$out"
            find /backups -maxdepth 1 -type f -name 'aigopushtg-*.dump' -mtime +14 -delete
          else
            rm -f "$$tmp"
            echo "Database backup failed" >&2
          fi
          sleep 86400
        done
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]
  bot:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.bot.main"]
    env_file: .env
    environment:
      DATABASE_URL: $DATABASE_URL
      REDIS_URL: $REDIS_URL
      DATA_DIR: /data
    volumes: [app_data:/data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [internal]
  api:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file: .env
    environment:
      DATABASE_URL: $DATABASE_URL
      REDIS_URL: $REDIS_URL
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8080:8080"]
    networks: [internal]
  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.workers.main"]
    env_file: .env
    environment:
      DATABASE_URL: $DATABASE_URL
      REDIS_URL: $REDIS_URL
      DATA_DIR: /data
    volumes: [app_data:/data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    networks: [internal]
volumes:
  postgres_data:
  redis_data:
  app_data:
networks:
  internal:
    driver: bridge
