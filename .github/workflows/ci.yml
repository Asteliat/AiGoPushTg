name: CI
on:
  push:
    branches: [main, feature/telegram-miniapp-control-center, feature/atcivperson-modular-suite]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests --select F
      - name: Check Mini App JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/api/static/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("Mini App inline script was not found")
          Path("/tmp/miniapp.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/miniapp.js
      - run: pytest -q
