[project]
name = "aigopushtg"
version = "0.1.0"
description = "Self-hosted Telegram account automation: AI replies, verification passing, group and channel discovery"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "telethon>=1.39,<2", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1",
  "redis>=5.2,<7", "pydantic-settings>=2.7,<3", "openai>=1.68,<3",
  "qrcode[pil]>=8.0,<9", "pillow>=11,<13", "python-socks[asyncio]>=2.7,<3",
  "cryptography>=44,<47"
]
[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "httpx>=0.28", "ruff>=0.11"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
