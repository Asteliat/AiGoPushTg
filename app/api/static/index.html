<style>
:root{color-scheme:light dark;--bg:var(--tg-theme-bg-color,#f4f7fc);--surface:var(--tg-theme-section-bg-color,var(--tg-theme-secondary-bg-color,#fff));--surface2:var(--tg-theme-secondary-bg-color,#f7f9fd);--text:var(--tg-theme-text-color,#18243a);--muted:var(--tg-theme-hint-color,#71809a);--line:var(--tg-theme-section-separator-color,#e7edf5);--blue:var(--tg-theme-button-color,#3978e8);--blue-soft:var(--tg-theme-secondary-bg-color,#eaf1ff);--input-bg:var(--tg-theme-bg-color,#fff);--label:var(--tg-theme-subtitle-text-color,#53627b);--bottom-bg:var(--tg-theme-secondary-bg-color,#ffffffed);--nav-muted:var(--tg-theme-hint-color,#8793a8);--notice-bg:var(--tg-theme-secondary-bg-color,#eef4ff);--notice-line:var(--tg-theme-section-separator-color,#dce8ff);--notice-text:var(--tg-theme-hint-color,#45628e);--danger-bg:var(--tg-theme-secondary-bg-color,#fff0f1);--warn-bg:var(--tg-theme-secondary-bg-color,#fff4e5);--soft-red:var(--tg-theme-secondary-bg-color,#fff0f1);--green:#16865d;--red:var(--tg-theme-destructive-text-color,#cf4c57);--shadow:0 8px 28px rgba(35,57,94,.055);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:14px;padding-bottom:calc(82px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:0 auto;min-height:100vh}.top{padding:calc(16px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.3px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#76a9ff,#3978e8);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 5px 14px #3978e833}.top small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:800}
main{padding:8px 16px 22px}.page-title{font-size:25px;letter-spacing:-.8px;margin:8px 2px 5px;font-weight:800}.subtitle{color:var(--muted);margin:0 2px 18px;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat,.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:15px;min-height:94px}.stat .n{font-size:26px;font-weight:800;letter-spacing:-.8px}.stat .k{font-size:12px;color:var(--muted);margin-top:4px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section-head h2{font-size:15px;margin:0;font-weight:750}.link{color:var(--blue);font-size:12px;font-weight:700;border:0;background:none;padding:6px}.card{padding:14px;margin-bottom:10px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.name{font-weight:750;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:12px;line-height:1.45}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted)}.pill.ok{background:var(--tg-theme-secondary-bg-color,#e8f7f0);color:var(--green)}.pill.off{background:var(--surface2);color:var(--muted)}.pill.warn{background:var(--warn-bg);color:var(--tg-theme-link-color,#a96a13)}.btn{border:0;border-radius:12px;background:var(--blue);color:white;padding:10px 14px;font-weight:700;font-size:12px}.btn.soft{background:var(--blue-soft);color:var(--blue)}.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--soft-red);color:var(--red)}.btn.small{padding:8px 10px}.btn:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700;color:var(--label)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--input-bg);padding:11px 12px;color:var(--text);outline:none}.field textarea{min-height:86px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#8eb3fa;box-shadow:0 0 0 3px #3978e815}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--input-bg);border-radius:999px;padding:9px 13px;color:var(--muted);font-size:12px;font-weight:700}.tab.active{background:var(--blue);border-color:var(--blue);color:white}.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed #d9e2ef;border-radius:18px}.empty b{display:block;color:var(--text);margin-bottom:5px}.bottom{position:fixed;z-index:5;bottom:0;left:0;right:0;background:var(--bottom-bg);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav{width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.nav button{border:0;background:transparent;color:var(--nav-muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:10px;font-weight:700}.nav button .ico{font-size:19px;line-height:22px}.nav button.active{color:var(--blue)}.notice{padding:12px 14px;background:var(--notice-bg);border:1px solid var(--notice-line);color:var(--notice-text);border-radius:14px;font-size:12px;line-height:1.5;margin:12px 0}.searchbar{display:flex;gap:8px}.searchbar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--input-bg)}.result{padding:13px 0;border-bottom:1px solid var(--line)}.result:last-child{border:0}.range{width:100%;accent-color:var(--blue)}.setting{padding:13px 0;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.setting-head{display:flex;justify-content:space-between;gap:10px;font-weight:700}.setting-head output{color:var(--blue)}dialog{width:min(560px,calc(100% - 24px));border:0;border-radius:22px;padding:0;box-shadow:0 24px 90px #14233e55;max-height:88vh}dialog::backdrop{background:#14233e66;backdrop-filter:blur(3px)}.modal{padding:18px;overflow:auto;max-height:88vh}.modal h3{margin:0 0 4px;font-size:19px}.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.toast{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:#1d2c45;color:#fff;border-radius:12px;padding:11px 15px;box-shadow:var(--shadow);max-width:90%;font-size:12px}.spinner{width:18px;height:18px;border:2px solid #d9e5f8;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:600px){main{padding:14px 22px 30px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.top{padding-left:24px;padding-right:24px}}
.module-grid{display:grid;grid-template-columns:1fr;gap:12px}.module-card{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:17px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--text);box-shadow:var(--shadow);transition:transform .16s,border-color .16s}.module-card:active{transform:scale(.99)}.module-icon{width:46px;height:46px;flex:0 0 46px;border-radius:15px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:23px;font-weight:800}.module-copy{flex:1;min-width:0}.module-title{font-weight:800;font-size:14px;margin-bottom:4px}.module-desc{font-size:12px;line-height:1.45;color:var(--muted)}.module-cta{white-space:nowrap;font-size:11px;color:var(--blue);font-weight:800}.account-module,.channel-module{padding:16px}.account-module .two,.channel-module .two{gap:12px}.channel-module textarea{min-height:74px}.link{cursor:pointer}.page-title{letter-spacing:-.9px}.section-head{margin-top:24px}
@media(min-width:760px){.module-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.module-card{min-height:118px}.module-card:hover{border-color:var(--blue)}}
@media(min-width:980px){.app{max-width:1040px}.module-grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:18px 30px 40px}.top{padding-left:30px;padding-right:30px}.bottom{left:50%;right:auto;transform:translateX(-50%);width:min(1040px,100%);border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:18px 18px 0 0}}

<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">A</div><div>AtcivPerson<small>Панель управления</small></div></div><div class="avatar" id="user-avatar">A</div></header>
<main id="content"><div class="empty"><div class="spinner"></div><p>Подключаем панель…</p></div></main>
</div>
<div class="bottom"><nav class="nav" id="nav">
<button data-page="home" class="active"><span class="ico">⌂</span>Главная</button>
<button data-page="accounts"><span class="ico">♙</span>Аккаунты</button>
<button data-page="ai"><span class="ico">✳</span>ИИ</button>
<button data-page="modules"><span class="ico">▦</span>Модули</button>
<button data-page="settings"><span class="ico">⚙</span>Ещё</button>
</nav></div>
<dialog id="dialog"><div class="modal" id="modal"></div></dialog>
<script>
(() => {
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('bg_color');tg.setBackgroundColor('bg_color');tg.setBottomBarColor('bottom_bar_bg_color')}catch{}}
const initData=tg?.initData||'';
const $=s=>document.querySelector(s), content=$('#content'), dialog=$('#dialog'), modal=$('#modal');
const state={page:'home',aiTab:'agents',toolTab:'groups',moduleId:'',accounts:[],agents:[],personas:[],examples:[],triggers:[],settings:{},logs:[],logDestinations:{},bindings:{groups:[],channels:[]},channelAssistant:[],channelActivity:[],contentDrafts:[],searchResults:[],searchKind:'groups',busy:false};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=msg=>{let n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),2600)};
async function api(path,opts={}){const res=await fetch('/v1/miniapp'+path,{...opts,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData,...opts.headers}});let data;try{data=await res.json()}catch{data={}}if(!res.ok)throw new Error(data.detail||'Ошибка запроса');return data}
const json=(method,body)=>({method,body:JSON.stringify(body)});
async function loadAll(){if(!initData){content.innerHTML='<div class="empty"><b>Откройте через Telegram</b>Для защиты панели авторизация доступна только через кнопку Mini App в боте.</div>';return}
try{const paths=['accounts','agents','personas','examples','triggers','settings','logs','logs/destinations','bindings','channel-assistant','channel-activity','content/drafts'];const [accounts,agents,personas,examples,triggers,settings,logs,logDestinations,bindings,channelAssistant,channelActivity,contentDrafts]=await Promise.all(paths.map(p=>api('/'+p)));Object.assign(state,{accounts,agents,personas,examples,triggers,settings,logs,logDestinations,bindings,channelAssistant,channelActivity,contentDrafts});const u=JSON.parse(new URLSearchParams(initData).get('user')||'{}');$('#user-avatar').textContent=(u.first_name||'A').slice(0,1).toUpperCase();render()}catch(e){content.innerHTML='<div class="empty"><b>Не удалось загрузить панель</b>'+esc(e.message)+'<div class="actions" style="justify-content:center"><button class="btn" id="retry">Повторить</button></div></div>';$('#retry')?.addEventListener('click',loadAll)}}
function pageHead(title,sub){return '<h1 class="page-title">'+title+'</h1><p class="subtitle">'+sub+'</p>'}
function empty(title,desc){return '<div class="empty"><b>'+title+'</b>'+desc+'</div>'}
function accountLabel(a){return esc(a.display_name||a.username||('Аккаунт #'+a.id))+' · #'+a.id}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page||state.page==='module'&&b.dataset.page==='modules'));({home:renderHome,accounts:renderAccounts,ai:renderAI,modules:renderModules,module:renderModule,settings:renderSettings})[state.page]()}
function renderHome(){const active=state.accounts.filter(a=>a.enabled&&!a.manual_pause).length;content.innerHTML=pageHead('Всё под контролем','Аккаунты, ИИ и автоматизация — в одном месте.')+
'<div class="grid"><div class="stat"><div class="n">'+state.accounts.length+'</div><div class="k">Аккаунты</div></div><div class="stat"><div class="n">'+active+'</div><div class="k">Активны</div></div><div class="stat"><div class="n">'+state.agents.length+'</div><div class="k">ИИ-агенты</div></div><div class="stat"><div class="n">'+state.triggers.filter(t=>t.enabled).length+'</div><div class="k">Активные триггеры</div></div></div>'+
'<div class="section-head"><h2>Быстрый доступ</h2></div><div class="grid">'+[['accounts','♙','Аккаунты'],['ai','✳','ИИ-агенты'],['modules','⌕','Модули'],['modules','◎','Модули автоматизации']].map(x=>'<button class="card" data-go="'+x[0]+'" style="text-align:left;border:1px solid var(--line);color:var(--text)"><div style="font-size:22px;color:var(--blue);margin-bottom:9px">'+x[1]+'</div><b>'+x[2]+'</b></button>').join('')+'</div>'+
'<div class="section-head"><h2>Последние события</h2><button class="link" data-go="settings" data-sub="logs">Все логи</button></div>'+state.logs.slice(0,4).map(logCard).join('')||empty('Пока нет событий','Здесь появится история действий и изменений.');
}
function renderAccounts(){content.innerHTML=pageHead('Аккаунты','Управляйте подключениями и назначайте каждому аккаунту своего ИИ-агента и персону.')+
(state.accounts.length?state.accounts.map(a=>'<article class="card"><div class="row between"><div class="grow"><div class="name">'+accountLabel(a)+'</div><div class="muted">'+(a.username?'@'+esc(a.username)+' · ':'')+'Telegram ID '+a.telegram_user_id+'</div></div><span class="pill '+(a.connection_status==='connected'?'ok':'off')+'">'+esc(a.connection_status==='connected'?'Подключён':a.connection_status)+'</span></div><div class="row between" style="margin-top:12px"><span class="muted">'+(a.enabled?'Включён':'Отключён')+' · '+(a.manual_pause?'На паузе':'Работает')+'</span><span class="pill '+(a.ai_enabled?'ok':'off')+'">'+(a.ai_enabled?'ИИ включён':'ИИ выключен')+'</span></div><div class="two" style="margin-top:12px"><div class="field" style="margin:0"><label>ИИ-агент</label><select data-account="'+a.id+'" data-field="ai_agent_id"><option value="">Не выбран</option>'+state.agents.map(x=>'<option value="'+x.id+'" '+(a.ai_agent_id===x.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div><div class="field" style="margin:0"><label>Персона</label><select data-account="'+a.id+'" data-field="persona_id"><option value="">Не выбрана</option>'+state.personas.map(x=>'<option value="'+x.id+'" '+(a.persona_id===x.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div></div><div class="field" style="margin-top:10px"><label>Режим ответов</label><select data-account="'+a.id+'" data-field="reply_mode"><option value="manual" '+(a.reply_mode==='manual'?'selected':'')+'>Ручной режим · черновики</option><option value="automatic" '+(a.reply_mode==='automatic'?'selected':'')+'>Автоматические ответы</option></select></div><div class="actions"><button class="btn soft small" data-account-action="ai" data-id="'+a.id+'">'+(a.ai_enabled?'Выключить ИИ':'Включить ИИ')+'</button><button class="btn ghost small" data-account-action="pause" data-id="'+a.id+'">'+(a.manual_pause?'Снять паузу':'Пауза')+'</button><button class="btn ghost small" data-account-action="enabled" data-id="'+a.id+'">'+(a.enabled?'Отключить':'Включить')+'</button></div></article>').join(''):empty('Аккаунтов пока нет','Подключённые аккаунты появятся здесь.'))}
function renderAI(){content.innerHTML=pageHead('Искусственный интеллект','Агенты, персоны и примеры — раздельно и с понятными связями.')+'<div class="tabs"><button class="tab '+(state.aiTab==='agents'?'active':'')+'" data-ai-tab="agents">Агенты</button><button class="tab '+(state.aiTab==='personas'?'active':'')+'" data-ai-tab="personas">Персоны</button><button class="tab '+(state.aiTab==='examples'?'active':'')+'" data-ai-tab="examples">Примеры</button></div>'+({agents:agentsView,personas:personasView,examples:examplesView})[state.aiTab]()}
function agentsView(){return '<div class="section-head"><h2>ИИ-агенты</h2><button class="btn small" data-action="agent-new">＋ Создать</button></div>'+(state.agents.length?state.agents.map(a=>'<article class="card"><div class="row between"><div class="grow"><div class="name">'+esc(a.name)+'</div><div class="muted">'+esc(a.model)+' · '+esc(a.base_url)+'</div></div><span class="pill '+(a.enabled?'ok':'off')+'">'+(a.enabled?'Активен':'Выключен')+'</span></div><div class="muted" style="margin-top:8px">'+(a.is_default?'Агент по умолчанию · ':'')+(a.has_api_key?'Ключ сохранён':'API-ключ не задан')+'</div><div class="actions"><button class="btn soft small" data-action="agent-edit" data-id="'+a.id+'">Настроить</button><button class="btn danger small" data-action="agent-delete" data-id="'+a.id+'">Удалить</button></div></article>').join(''):empty('Нет ИИ-агентов','Создайте агента и укажите провайдера и модель.'))}
function personasView(){return '<div class="section-head"><h2>Персоны</h2><button class="btn small" data-action="persona-new">＋ Создать</button></div>'+(state.personas.length?state.personas.map(p=>'<article class="card"><div class="row between"><div class="name">'+esc(p.name)+'</div><button class="link" data-action="persona-edit" data-id="'+p.id+'">Изменить</button></div><div class="muted" style="margin-top:6px">'+esc(p.description||'Без описания')+'</div><div class="muted" style="margin-top:8px">'+esc(p.style_instructions).slice(0,240)+'</div></article>').join(''):empty('Персон пока нет','Персона задаёт характер и стиль ответов ИИ.'))}
function examplesView(){return '<div class="section-head"><h2>Примеры общения</h2><button class="btn small" data-action="example-new">＋ Добавить</button></div><div class="notice">Добавляйте только примеры, которые разрешено использовать. Перед сохранением удаляйте персональные данные.</div>'+(state.examples.length?state.examples.map(e=>'<article class="card"><div class="row between"><div class="name">'+esc(e.title||'Пример #'+e.id)+'</div><button class="btn danger small" data-action="example-delete" data-id="'+e.id+'">Удалить</button></div><div class="muted" style="margin-top:8px">Входящее сообщение</div><div>'+esc(e.incoming_text).slice(0,260)+'</div><div class="muted" style="margin-top:8px">Предпочтительный ответ</div><div>'+esc(e.preferred_reply).slice(0,260)+'</div></article>').join(''):empty('Примеров пока нет','Добавьте пары «сообщение → желаемый ответ».'))}
function searchView(){const kind=state.toolTab;return '<div class="card"><div class="field"><label>Аккаунт для поиска</label><select id="search-account">'+state.accounts.map(a=>'<option value="'+a.id+'">'+accountLabel(a)+'</option>').join('')+'</select></div><div class="field"><label>Что ищем?</label><div class="searchbar"><input id="search-query" placeholder="Например: маркетинг, дизайн, путешествия"><button class="btn" id="search-run">Найти</button></div></div><div class="muted">Результаты проверяются через Telegram. Добавление в список не означает автоматического вступления или подписки.</div></div><div id="search-results">'+(state.searchResults.length?state.searchResults.map(searchResult).join(''):empty('Начните поиск','Введите тему и выберите аккаунт.'))+'</div>'}
function searchResult(r){const add=(r.id!==null&&r.id!==undefined)?'<button class="btn soft small" data-save-result="'+encodeURIComponent(JSON.stringify(r))+'">Добавить в мой список</button>':'<span class="pill off">Нет ID для привязки</span>';return '<div class="result"><div class="row between"><div class="grow"><div class="name">'+esc(r.title)+'</div><div class="muted">'+Number(r.members||0).toLocaleString('ru-RU')+' участников · '+esc(r.source||'Telegram')+'</div></div><span class="pill '+(r.verified?'ok':'warn')+'">'+(r.verified?'Проверено':'Не проверено')+'</span></div><div class="muted" style="margin-top:5px">'+esc(r.link)+'</div><div class="actions">'+add+'<button class="btn ghost small" data-copy="'+esc(r.link)+'">Копировать ссылку</button></div></div>'}

span class="muted">'+d.chat_id+(d.thread_id?' · тема '+d.thread_id:' · общий чат')+'</span><button class="btn danger small" data-action="log-remove" data-category="'+category+'" data-chat="'+d.chat_id+'" data-thread="'+(d.thread_id||'')+'">Удалить</button></div>').join(''):'<div class="muted" style="padding-top:8px">Получатели не настроены</div>')+'</article>').join('')+'<div class="section-head"><h2>Журнал событий</h2><span class="muted">Последние 200</span></div>'+state.logs.map(logCard).join('')+(state.logs.length?'':empty('Логов пока нет','События появятся после действий в панели.'))}
function logCard(l){return '<div class="card"><div class="row between"><b>'+esc(l.action)+'</b><span class="muted">'+esc((l.created_at||'').replace('T',' ').slice(0,16))+'</span></div><div class="muted">'+esc(l.object_type)+' '+esc(l.object_id)+'</div></div>'}
function openModal(title,body,submitText,onSubmit){modal.innerHTML='<h3>'+title+'</h3>'+body+'<div class="modal-foot"><button class="btn ghost" type="button" id="modal-cancel">Отмена</button><button class="btn" type="button" id="modal-save">'+submitText+'</button></div>';dialog.showModal();$('#modal-cancel').onclick=()=>dialog.close();$('#modal-save').onclick=async()=>{const b=$('#modal-save');b.disabled=true;try{await onSubmit(modal);dialog.close();await refreshPage();toast('Сохранено')}catch(e){toast(e.message)}finally{b.disabled=false}}}
const val=(m,id)=>m.querySelector('#'+id)?.value??'';
function agentModal(a){const edit=!!a;const prob=(id,label,key,max=100)=>'<div class="field"><label>'+label+'</label><input id="'+id+'" type="number" min="0" max="'+max+'" placeholder="Глобальное" value="'+(a?.[key]??'')+'"></div>';openModal(edit?'Настройки ИИ-агента':'Новый ИИ-агент','<div class="field"><label>Название</label><input id="name" value="'+esc(a?.name||'')+'"></div><div class="field"><label>API Base URL</label><input id="base_url" value="'+esc(a?.base_url||'https://api.openai.com/v1')+'"></div><div class="field"><label>Модель</label><input id="model" value="'+esc(a?.model||'gpt-4o-mini')+'"></div><div class="field"><label>API-ключ '+(a?.has_api_key?'(оставьте пустым, чтобы не менять)':'')+'</label><input id="api_key" type="password" autocomplete="new-password"></div><div class="two"><div class="field"><label>Таймаут, сек.</label><input id="timeout" type="number" min="5" max="180" value="'+(a?.timeout_seconds||45)+'"></div><div class="field"><label>Статус</label><select id="enabled"><option value="true" '+(a?.enabled!==false?'selected':'')+'>Активен</option><option value="false" '+(a?.enabled===false?'selected':'')+'>Выключен</option></select></div></div><div class="field"><label><input id="default" type="checkbox" '+(a?.is_default?'checked':'')+'> Агент по умолчанию</label></div><div class="section-head"><h2>Индивидуальное поведение</h2></div><div class="notice">Пустое значение означает «использовать глобальную настройку». Значение 0% отключает действие для этого агента.</div><div class="two">'+prob('mention_probability','Ответ на упоминание, %','mention_reply_probability_override')+prob('dm_probability','Ответ в личке, %','dm_reply_probability_override')+prob('proactive_probability','Инициативный ответ, %','proactive_reply_probability_override')+prob('channel_probability','Ответы по каналам, %','channel_reply_probability_override')+prob('cooldown','Пауза между ответами, сек.','reply_cooldown_seconds_override',2147483647)+prob('channel_cooldown','Пауза по каналам, сек.','channel_reply_cooldown_seconds_override',2147483647)+'</div>',edit?'Сохранить':'Создать',async m=>{const nullable=id=>val(m,id)===''?null:Number(val(m,id));const p={name:val(m,'name'),base_url:val(m,'base_url'),model:val(m,'model'),timeout_seconds:Number(val(m,'timeout')),enabled:val(m,'enabled')==='true',is_default:$('#default').checked,api_key:val(m,'api_key'),mention_reply_probability_override:nullable('mention_probability'),dm_reply_probability_override:nullable('dm_probability'),proactive_reply_probability_override:nullable('proactive_probability'),channel_reply_probability_override:nullable('channel_probability'),reply_cooldown_seconds_override:nullable('cooldown'),channel_reply_cooldown_seconds_override:nullable('channel_cooldown')};await api(edit?'/agents/'+a.id:'/agents',json(edit?'PATCH':'POST',p))})}
function personaModal(p){const edit=!!p;openModal(edit?'Редактировать персону':'Новая персона','<div class="field"><label>Название</label><input id="name" value="'+esc(p?.name||'')+'"></div><div class="field"><label>Краткое описание</label><input id="description" value="'+esc(p?.description||'')+'"></div><div class="field"><label>Инструкция и стиль общения</label><textarea id="style">'+esc(p?.style_instructions||'')+'</textarea></div>',edit?'Сохранить':'Создать',async m=>{await api(edit?'/personas/'+p.id:'/personas',json(edit?'PATCH':'POST',{name:val(m,'name'),description:val(m,'description'),style_instructions:val(m,'style')}))})}
function exampleModal(){openModal('Новый пример','<div class="field"><label>Название</label><input id="title" placeholder="Например: дружелюбный ответ"></div><div class="field"><label>Персона</label><select id="persona"><option value="">Общая подборка</option>'+state.personas.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></div><div class="field"><label>Входящее сообщение</label><textarea id="incoming"></textarea></div><div class="field"><label>Предпочтительный ответ</label><textarea id="reply"></textarea></div><div class="field"><label><input id="consent" type="checkbox"> Подтверждаю право использовать эти данные</label></div>', 'Добавить',async m=>{if(!$('#consent').checked)throw Error('Нужно подтвердить право использовать пример');await api('/examples',json('POST',{title:val(m,'title'),persona_id:val(m,'persona')?Number(val(m,'persona')):null,incoming_text:val(m,'incoming'),preferred_reply:val(m,'reply'),consent_confirmed:true}))})}
function triggerModal(t){const edit=!!t;openModal(edit?'Настройки триггера':'Новый триггер','<div class="field"><label>Ключевые слова и фразы</label><textarea id="terms" placeholder="Каждая фраза с новой строки">'+esc(t?.terms||'')+'</textarea></div><div class="field"><label>Инструкция для ответа</label><textarea id="instructions">'+esc(t?.response_instructions||'')+'</textarea></div><div class="field"><label>Область действия</label><select id="account"><option value="">Глобальный — все аккаунты</option>'+state.accounts.map(a=>'<option value="'+a.id+'" '+(t?.account_id===a.id?'selected':'')+'>'+accountLabel(a)+'</option>').join('')+'</select></div><div class="two"><div class="field"><label>Режим</label><select id="mode"><option value="empty_only">Только аккаунтам без локальных триггеров</option><option value="all" '+(t?.apply_mode==='all'?'selected':'')+'>Всем аккаунтам без исключения</option></select></div><div class="field"><label>Пауза триггера, сек.</label><input id="cooldown" type="number" min="0" max="31536000" value="'+(t?.cooldown_seconds??900)+'"></div><div class="field"><label>Пауза между сообщениями, сек.</label><input id="message_cooldown" type="number" min="0" max="31536000" value="'+(t?.message_cooldown_seconds??0)+'"></div></div>',edit?'Сохранить':'Создать',async m=>{const p={terms:val(m,'terms'),response_instructions:val(m,'instructions'),account_id:val(m,'account')?Number(val(m,'account')):null,apply_mode:val(m,'account')?'account':val(m,'mode'),cooldown_seconds:Number(val(m,'cooldown')),message_cooldown_seconds:Number(val(m,'message_cooldown')),enabled:t?.enabled??true};await api(edit?'/triggers/'+t.id:'/triggers',json(edit?'PATCH':'POST',p))})}
async function refreshPage(){const paths=['accounts','agents','personas','examples','triggers','settings','logs','logs/destinations','bindings','channel-assistant','channel-activity','content/drafts'];const [accounts,agents,personas,examples,triggers,settings,logs,logDestinations,bindings,channelAssistant,channelActivity,contentDrafts]=await Promise.all(paths.map(p=>api('/'+p)));Object.assign(state,{accounts,agents,personas,examples,triggers,settings,logs,logDestinations,bindings,channelAssistant,channelActivity,contentDrafts});render()}
async function search(){const q=$('#search-query')?.value?.trim(),aid=Number($('#search-account')?.value);if(!q||!aid){toast('Укажите запрос и аккаунт');return}const btn=$('#search-run');btn.disabled=true;btn.textContent='Ищем…';try{const d=await api('/search/'+state.toolTab,json('POST',{account_id:aid,query:q,limit:30}));state.searchResults=d.results||[];$('#search-results').innerHTML=state.searchResults.length?state.searchResults.map(searchResult).join(''):empty('Ничего не найдено','Попробуйте изменить запрос.')}catch(e){toast(e.message)}finally{btn.disabled=false;btn.textContent='Найти'}}
content.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{
if(b.dataset.go){state.page=b.dataset.go;if(b.dataset.sub==='logs')state.page='settings';render();return}

if(b.hasAttribute('data-refresh-content')){await refreshPage();return}
if(b.dataset.channelSave){const card=content.querySelector('[data-channel-card="'+b.dataset.channelSave+'"]');const values={};card.querySelectorAll('[data-channel-field]').forEach(x=>{let v=x.value;if(x.dataset.channelField==='enabled')v=v==='true';else if(['reply_probability_override','reply_cooldown_seconds_override'].includes(x.dataset.channelField))v=v===''?null:Number(v);else if(x.dataset.channelField==='reply_mode_override')v=v||null;values[x.dataset.channelField]=v});await api('/channel-assistant/'+b.dataset.channelSave,json('PATCH',values));await refreshPage();toast('Настройки канала сохранены');return}
if(b.id==='content-generate'){const brief=$('#content-brief').value.trim();if(brief.length<5){toast('Опишите задачу для ИИ');return}b.disabled=true;b.textContent='Создаём…';try{await api('/content/generate',json('POST',{account_id:$('#content-account').value?Number($('#content-account').value):null,channel_binding_id:$('#content-channel').value?Number($('#content-channel').value):null,agent_id:$('#content-agent').value?Number($('#content-agent').value):null,persona_id:$('#content-persona').value?Number($('#content-persona').value):null,title:$('#content-title').value,brief}));await refreshPage();toast('Черновик создан')}finally{b.disabled=false;b.textContent='✦ Создать черновик'}return}
if(b.dataset.draftSave){const id=b.dataset.draftSave,body=content.querySelector('[data-draft-body="'+id+'"]').value;await api('/content/drafts/'+id,json('PATCH',{body}));await refreshPage();toast('Черновик сохранён');return}
if(b.dataset.draftArchive){const d=state.contentDrafts.find(x=>x.id===Number(b.dataset.draftArchive));await api('/content/drafts/'+d.id,json('PATCH',{status:d.status==='draft'?'archived':'draft'}));await refreshPage();return}
if(b.dataset.draftDelete){if(!confirm('Удалить этот черновик?'))return;await api('/content/drafts/'+b.dataset.draftDelete,{method:'DELETE'});await refreshPage();return}
if(b.dataset.draftCopy){const d=state.contentDrafts.find(x=>x.id===Number(b.dataset.draftCopy));await navigator.clipboard.writeText(content.querySelector('[data-draft-body="'+d.id+'"]').value);toast('Текст скопирован');return}
if(b.dataset.aiTab){state.aiTab=b.dataset.aiTab;render();return}
if(b.dataset.toolTab){state.toolTab=b.dataset.toolTab;state.searchResults=[];render();return}
if(b.dataset.bindingDelete){if(!confirm('Удалить площадку из сохранённого списка? Аккаунт не выйдет из группы или канала.'))return;await api('/bindings/'+b.dataset.bindingDelete+'/'+b.dataset.id,{method:'DELETE'});await refreshPage();toast('Площадка удалена из списка');return}

if(b.id==='search-run'){search();return}
if(b.id==='global-ai'){await api('/settings',json('PUT',{values:{ai_global_enabled:!state.settings.ai_global_enabled}}));await refreshPage();return}
if(b.id==='save-settings'){const values={};content.querySelectorAll('[data-setting]').forEach(x=>values[x.dataset.setting]=Number(x.value));const applyAll=confirm('Применить новые значения ко всем ИИ-агентам, включая те, у которых уже заданы индивидуальные настройки?\n\nОК — перезаписать индивидуальные значения. Отмена — сохранить индивидуальные настройки и изменить только глобальные значения по умолчанию.');await api('/settings',json('PUT',{values,apply_to_agents:applyAll?'all':'inherit'}));await refreshPage();toast('Настройки обновлены');return}
if(b.dataset.action==='agent-new'){agentModal();return}

if(b.dataset.action==='trigger-new'){triggerModal();return}
if(b.dataset.action==='trigger-edit'){triggerModal(state.triggers.find(x=>x.id===Number(b.dataset.id)));return}
if(b.dataset.action==='trigger-toggle'){const t=state.triggers.find(x=>x.id===Number(b.dataset.id));await api('/triggers/'+t.id,json('PATCH',{...t,enabled:!t.enabled}));await refreshPage();return}

if(b.dataset.action==='log-add'){const cat=b.dataset.category;openModal('Добавить получателя логов','<div class="field"><label>ID чата или супергруппы</label><input id="chat_id" type="number" placeholder="-1001234567890"></div><div class="field"><label>ID темы форума (необязательно)</label><input id="thread_id" type="number" min="1" placeholder="Оставьте пустым для общего чата"></div><div class="notice">Перед сохранением бот отправит тестовое сообщение. Если Telegram его не доставит, получатель не будет добавлен.</div>','Проверить и добавить',async m=>{const chat=Number(val(m,'chat_id'));if(!chat)throw Error('Укажите корректный ID чата');await api('/logs/destinations/'+cat,json('POST',{chat_id:chat,thread_id:val(m,'thread_id')?Number(val(m,'thread_id')):null}))});return}
if(b.dataset.action==='log-remove'){if(confirm('Удалить получателя из этой категории логов?')){const q='?chat_id='+encodeURIComponent(b.dataset.chat)+(b.dataset.thread?'&thread_id='+encodeURIComponent(b.dataset.thread):'');await api('/logs/destinations/'+b.dataset.category+q,{method:'DELETE'});await refreshPage()}return}
if(b.dataset.accountAction){const a=state.accounts.find(x=>x.id===Number(b.dataset.id));const patch=b.dataset.accountAction==='ai'?{ai_enabled:!a.ai_enabled}:b.dataset.accountAction==='pause'?{manual_pause:!a.manual_pause}:{enabled:!a.enabled};await api('/accounts/'+a.id,json('PATCH',patch));await refreshPage();return}
if(b.dataset.saveResult){const r=JSON.parse(decodeURIComponent(b.dataset.saveResult));const aid=Number($('#search-account').value);await api('/bindings',json('POST',{account_id:aid,kind:state.searchKind,peer_id:Number(r.id),title:r.title}));toast('Добавлено в список, пока выключено');return}
if(b.dataset.copy){await navigator.clipboard.writeText(b.dataset.copy);toast('Ссылка скопирована');return}
}catch(err){toast(err.message)}});
content.addEventListener('change',async e=>{const s=e.target;if(s.dataset.account){const field=s.dataset.field;let value;if(['reply_mode','channel_reply_mode','channel_post_instructions','channel_comments_instructions','channel_restrictions_instructions'].includes(field))value=s.value;else if(field==='channel_chat_replies_enabled')value=s.value==='true';else value=s.value===''?null:Number(s.value);try{await api('/accounts/'+s.dataset.account,json('PATCH',{[field]:value}));toast('Настройки аккаунта сохранены')}catch(err){toast(err.message)}}});
