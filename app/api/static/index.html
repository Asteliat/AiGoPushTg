<style>
:root{color-scheme:light dark;--bg:var(--tg-theme-bg-color,#f4f7fc);--surface:var(--tg-theme-section-bg-color,var(--tg-theme-secondary-bg-color,#fff));--surface2:var(--tg-theme-secondary-bg-color,#f7f9fd);--text:var(--tg-theme-text-color,#18243a);--muted:var(--tg-theme-hint-color,#71809a);--line:var(--tg-theme-section-separator-color,#e7edf5);--blue:var(--tg-theme-button-color,#3978e8);--blue-soft:var(--tg-theme-secondary-bg-color,#eaf1ff);--input-bg:var(--tg-theme-bg-color,#fff);--label:var(--tg-theme-subtitle-text-color,#53627b);--bottom-bg:var(--tg-theme-secondary-bg-color,#ffffffed);--nav-muted:var(--tg-theme-hint-color,#8793a8);--notice-bg:var(--tg-theme-secondary-bg-color,#eef4ff);--notice-line:var(--tg-theme-section-separator-color,#dce8ff);--notice-text:var(--tg-theme-hint-color,#45628e);--danger-bg:var(--tg-theme-secondary-bg-color,#fff0f1);--warn-bg:var(--tg-theme-secondary-bg-color,#fff4e5);--soft-red:var(--tg-theme-secondary-bg-color,#fff0f1);--green:#16865d;--red:var(--tg-theme-destructive-text-color,#cf4c57);--shadow:0 8px 28px rgba(35,57,94,.055);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:0 auto;min-height:100vh}.top{padding:calc(16px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.3px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#76a9ff,#3978e8);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 5px 14px #3978e833}.top small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:800}
main{padding:8px 16px 22px}.page-title{font-size:25px;letter-spacing:-.8px;margin:8px 2px 5px;font-weight:800}.subtitle{color:var(--muted);margin:0 2px 18px;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat,.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:15px;min-height:94px}.stat .n{font-size:26px;font-weight:800;letter-spacing:-.8px}.stat .k{font-size:12px;color:var(--muted);margin-top:4px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section-head h2{font-size:15px;margin:0;font-weight:750}.link{color:var(--blue);font-size:12px;font-weight:700;border:0;background:none;padding:6px}.card{padding:14px;margin-bottom:10px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.name{font-weight:750;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:12px;line-height:1.45}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted)}.pill.ok{background:var(--tg-theme-secondary-bg-color,#e8f7f0);color:var(--green)}.pill.off{background:var(--surface2);color:var(--muted)}.pill.warn{background:var(--warn-bg);color:var(--tg-theme-link-color,#a96a13)}.btn{border:0;border-radius:12px;background:var(--blue);color:white;padding:10px 14px;font-weight:700;font-size:12px}.btn.soft{background:var(--blue-soft);color:var(--blue)}.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--soft-red);color:var(--red)}.btn.small{padding:8px 10px}.btn:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700;color:var(--label)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--input-bg);padding:11px 12px;color:var(--text);outline:none}.field textarea{min-height:86px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#8eb3fa;box-shadow:0 0 0 3px #3978e815}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--input-bg);border-radius:999px;padding:9px 13px;color:var(--muted);font-size:12px;font-weight:700}.tab.active{background:var(--blue);border-color:var(--blue);color:white}.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed #d9e2ef;border-radius:18px}.empty b{display:block;color:var(--text);margin-bottom:5px}.bottom{position:fixed;z-index:5;bottom:0;left:0;right:0;background:var(--bottom-bg);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav{width:min(760px,100%);display:grid;grid-template-columns:repeat(6,1fr);gap:2px}.nav button{border:0;background:transparent;color:var(--nav-muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:9px;font-weight:700}.nav button .ico{font-size:19px;line-height:22px}.nav button.active{color:var(--blue)}.notice{padding:12px 14px;background:var(--notice-bg);border:1px solid var(--notice-line);color:var(--notice-text);border-radius:14px;font-size:12px;line-height:1.5;margin:12px 0}.searchbar{display:flex;gap:8px}.searchbar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--input-bg)}.result{padding:13px 0;border-bottom:1px solid var(--line)}.result:last-child{border:0}.range{width:100%;accent-color:var(--blue)}.setting{padding:13px 0;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.setting-head{display:flex;justify-content:space-between;gap:10px;font-weight:700}.setting-head output{color:var(--blue)}dialog{width:min(560px,calc(100% - 24px));border:0;border-radius:22px;padding:0;box-shadow:0 24px 90px #14233e55;max-height:88vh}dialog::backdrop{background:#14233e66;backdrop-filter:blur(3px)}.modal{padding:18px;overflow:auto;max-height:88vh}.modal h3{margin:0 0 4px;font-size:19px}.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.toast{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:#1d2c45;color:#fff;border-radius:12px;padding:11px 15px;box-shadow:var(--shadow);max-width:90%;font-size:12px}.spinner{width:18px;height:18px;border:2px solid #d9e5f8;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:600px){main{padding:14px 22px 30px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.top{padding-left:24px;padding-right:24px}}
.inbox-layout{display:grid;grid-template-columns:1fr;gap:12px}.inbox-list,.inbox-chat{min-width:0;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:12px}.inbox-dialog{display:block;width:100%;text-align:left;padding:11px;margin-top:7px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--text)}.inbox-dialog.active{border-color:var(--blue);background:var(--blue-soft)}.inbox-preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.inbox-messages{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;padding:12px 0}.message-row{display:flex}.message-row.out{justify-content:flex-end}.message-bubble{max-width:88%;padding:10px 12px;border-radius:14px;background:var(--surface2);font-size:13px;line-height:1.5;overflow-wrap:anywhere}.message-row.out .message-bubble{background:var(--blue-soft)}.message-bubble small{display:block;color:var(--muted);font-size:10px;margin-top:5px}@media(min-width:820px){.inbox-layout{grid-template-columns:minmax(240px,320px) minmax(0,1fr)}.inbox-chat{min-height:460px}.inbox-messages{max-height:520px}}.module-grid{display:grid;grid-template-columns:1fr;gap:12px}.module-card{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:17px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--text);box-shadow:var(--shadow);transition:transform .16s,border-color .16s}.module-card:active{transform:scale(.99)}.module-icon{width:46px;height:46px;flex:0 0 46px;border-radius:15px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:23px;font-weight:800}.module-copy{flex:1;min-width:0}.module-title{font-weight:800;font-size:14px;margin-bottom:4px}.module-desc{font-size:12px;line-height:1.45;color:var(--muted)}.module-cta{white-space:nowrap;font-size:11px;color:var(--blue);font-weight:800}.account-module,.channel-module{padding:16px}.account-module .two,.channel-module .two{gap:12px}.channel-module textarea{min-height:74px}.link{cursor:pointer}.page-title{letter-spacing:-.9px}.section-head{margin-top:24px}
@media(min-width:760px){.module-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.module-card{min-height:118px}.module-card:hover{border-color:var(--blue)}}
@media(min-width:980px){.app{max-width:1040px}.module-grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:18px 30px 40px}.top{padding-left:30px;padding-right:30px}.bottom{left:50%;right:auto;transform:translateX(-50%);width:min(1040px,100%);border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:18px 18px 0 0}}

<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">A</div><div>AtcivPerson<small>Панель управления</small></div></div><div class="avatar" id="user-avatar">A</div></header>
<main id="content"><div class="empty"><div class="spinner"></div><p>Подключаем панель…</p></div></main>
</div>
<div class="bottom"><nav class="nav" id="nav">
<button data-page="home" class="active"><span class="ico">⌂</span>Главная</button>
<button data-page="accounts"><span class="ico">♙</span>Аккаунты</button>
<button data-page="ai"><span class="ico">✳</span>ИИ</button>
<button data-page="modules"><span class="ico">▦</span>Модули</button>
<button data-page="automation"><span class="ico">⇄</span>Автоматизация</button>
<button data-page="settings"><span class="ico">⚙</span>Ещё</button>
</nav></div>
<dialog id="dialog"><div class="modal" id="modal"></div></dialog>
<script>
(() => {
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('bg_color');tg.setBackgroundColor('bg_color');tg.setBottomBarColor('bottom_bar_bg_color')}catch{}}
const initData=tg?.initData||'';
const $=s=>document.querySelector(s), content=$('#content'), dialog=$('#dialog'), modal=$('#modal');
const state={page:'home',aiTab:'agents',toolTab:'groups',moduleId:'',modules:[],moduleSettings:{},automationTasks:[],automationTargets:[],automationConsents:[],accounts:[],agents:[],personas:[],examples:[],triggers:[],settings:{},logs:[],logDestinations:{},bindings:{groups:[],channels:[]},channelAssistant:[],channelActivity:[],contentDrafts:[],inboxAccountId:null,inboxDialogs:[],inboxLoadedFor:null,inboxMessages:[],inboxMessagesLoadedFor:null,inboxPeer:null,inboxLoading:false,inboxDialogsRequest:0,inboxMessagesRequest:0,inboxDraft:'',searchResults:[],searchKind:'groups',busy:false};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=msg=>{let n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),2600)};
async function api(path,opts={}){const res=await fetch('/v1/miniapp'+path,{...opts,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData,...opts.headers}});let data;try{data=await res.json()}catch{data={}}if(!res.ok)throw new Error(data.detail||'Ошибка запроса');return data}
const json=(method,body)=>({method,body:JSON.stringify(body)});
async function loadAll(){if(!initData){content.innerHTML='<div class="empty"><b>Откройте через Telegram</b>Для защиты панели авторизация доступна только через кнопку Mini App в боте.</div>';return}
try{const paths=['accounts','agents','personas','examples','triggers','settings','logs','logs/destinations','bindings','channel-assistant','channel-activity','content/drafts','modules'];const [accounts,agents,personas,examples,triggers,settings,logs,logDestinations,bindings,channelAssistant,channelActivity,contentDrafts,modules]=await Promise.all(paths.map(p=>api('/'+p)));Object.assign(state,{accounts,agents,personas,examples,triggers,settings,logs,logDestinations,bindings,channelAssistant,channelActivity,contentDrafts,modules});state.moduleSettings=Object.fromEntries(modules.map(m=>[m.id,m.settings]));const u=JSON.parse(new URLSearchParams(initData).get('user')||'{}');$('#user-avatar').textContent=(u.first_name||'A').slice(0,1).toUpperCase();render()}catch(e){content.innerHTML='<div class="empty"><b>Не удалось загрузить панель</b>'+esc(e.message)+'<div class="actions" style="justify-content:center"><button class="btn" id="retry">Повторить</button></div></div>';$('#retry')?.addEventListener('click',loadAll)}}
function pageHead(title,sub){return '<h1 class="page-title">'+title+'</h1><p class="subtitle">'+sub+'</p>'}
function empty(title,desc){return '<div class="empty"><b>'+title+'</b>'+desc+'</div>'}
function accountLabel(a){return esc(a.display_name||a.username||('Аккаунт #'+a.id))+' · #'+a.id}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page||state.page==='module'&&b.dataset.page==='modules'));({home:renderHome,accounts:renderAccounts,ai:renderAI,modules:renderModules,module:renderModule,automation:renderAutomation,settings:renderSettings})[state.page]()}
function renderHome(){const active=state.accounts.filter(a=>a.enabled&&!a.manual_pause).length;content.innerHTML=pageHead('Всё под контролем','Аккаунты, ИИ и автоматизация — в одном месте.')+
'<div class="grid"><div class="stat"><div class="n">'+state.accounts.length+'</div><div class="k">Аккаунты</div></div><div class="stat"><div class="n">'+active+'</div><div class="k">Активны</div></div><div class="stat"><div class="n">'+state.agents.length+'</div><div class="k">ИИ-агенты</div></div><div class="stat"><div class="n">'+state.triggers.filter(t=>t.enabled).length+'</div><div class="k">Активные триггеры</div></div></div>'+
'<div class="section-head"><h2>Быстрый доступ</h2></div><div class="grid">'+[['accounts','♙','Аккаунты'],['ai','✳','ИИ-агенты'],['modules','⌕','Модули'],['automation','⇄','Автоматизация']].map(x=>'<button class="card" data-go="'+x[0]+'" style="text-align:left;border:1px solid var(--line);color:var(--text)"><div style="font-size:22px;color:var(--blue);margin-bottom:9px">'+x[1]+'</div><b>'+x[2]+'</b></button>').join('')+'</div>'+
'<div class="section-head"><h2>Последние события</h2><button class="link" data-go="settings" data-sub="logs">Все логи</button></div>'+state.logs.slice(0,4).map(logCard).join('')||empty('Пока нет событий','Здесь появится история действий и изменений.');
}
function renderAccounts(){content.innerHTML=pageHead('Аккаунты','Управляйте подключениями и назначайте каждому аккаунту своего ИИ-агента и персону.')+
(state.accounts.length?state.accounts.map(a=>'<article class="card"><div class="row between"><div class="grow"><div class="name">'+accountLabel(a)+'</div><div class="muted">'+(a.username?'@'+esc(a.username)+' · ':'')+'Telegram ID '+a.telegram_user_id+'</div></div><span class="pill '+(a.connection_status==='connected'?'ok':'off')+'">'+esc(a.connection_status==='connected'?'Подключён':a.connection_status)+'</span></div><div class="row between" style="margin-top:12px"><span class="muted">'+(a.enabled?'Включён':'Отключён')+' · '+(a.manual_pause?'На паузе':'Работает')+'</span><span class="pill '+(a.ai_enabled?'ok':'off')+'">'+(a.ai_enabled?'ИИ включён':'ИИ выключен')+'</span></div><div class="two" style="margin-top:12px"><div class="field" style="margin:0"><label>ИИ-агент</label><select data-account="'+a.id+'" data-field="ai_agent_id"><option value="">Не выбран</option>'+state.agents.map(x=>'<option value="'+x.id+'" '+(a.ai_agent_id===x.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div><div class="field" style="margin:0"><label>Персона</label><select data-account="'+a.id+'" data-field="persona_id"><option value="">Не выбрана</option>'+state.personas.map(x=>'<option value="'+x.id+'" '+(a.persona_id===x.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div></div><div class="field" style="margin-top:10px"><label>Режим ответов</label><select data-account="'+a.id+'" data-field="reply_mode"><option value="manual" '+(a.reply_mode==='manual'?'selected':'')+'>Ручной режим · черновики</option><option value="automatic" '+(a.reply_mode==='automatic'?'selected':'')+'>Автоматические ответы</option></select></div><div class="actions"><button class="btn soft small" data-account-action="ai" data-id="'+a.id+'">'+(a.ai_enabled?'Выключить ИИ':'Включить ИИ')+'</button><button class="btn ghost small" data-account-action="pause" data-id="'+a.id+'">'+(a.manual_pause?'Снять паузу':'Пауза')+'</button><button class="btn ghost small" data-account-action="enabled" data-id="'+a.id+'">'+(a.enabled?'Отключить':'Включить')+'</button></div></article>').join(''):empty('Аккаунтов пока нет','Подключённые аккаунты появятся здесь.'))}
function renderAI(){content.innerHTML=pageHead('Искусственный интеллект','Агенты, персоны и примеры — раздельно и с понятными связями.')+'<div class="tabs"><button class="tab '+(state.aiTab==='agents'?'active':'')+'" data-ai-tab="agents">Агенты</button><button class="tab '+(state.aiTab==='personas'?'active':'')+'" data-ai-tab="personas">Персоны</button><button class="tab '+(state.aiTab==='examples'?'active':'')+'" data-ai-tab="examples">Примеры</button></div>'+({agents:agentsView,personas:personasView,examples:examplesView})[state.aiTab]()}
function agentsView(){return '<div class="section-head"><h2>ИИ-агенты</h2><button class="btn small" data-action="agent-new">＋ Создать</button></div>'+(state.agents.length?state.agents.map(a=>'<article class="card"><div class="row between"><div class="grow"><div class="name">'+esc(a.name)+'</div><div class="muted">'+esc(a.model)+' · '+esc(a.base_url)+'</div></div><span class="pill '+(a.enabled?'ok':'off')+'">'+(a.enabled?'Активен':'Выключен')+'</span></div><div class="muted" style="margin-top:8px">'+(a.is_default?'Агент по умолчанию · ':'')+(a.has_api_key?'Ключ сохранён':'API-ключ не задан')+'</div><div class="actions"><button class="btn soft small" data-action="agent-edit" data-id="'+a.id+'">Настроить</button><button class="btn danger small" data-action="agent-delete" data-id="'+a.id+'">Удалить</button></div></article>').join(''):empty('Нет ИИ-агентов','Создайте агента и укажите провайдера и модель.'))}
