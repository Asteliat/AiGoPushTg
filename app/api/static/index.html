<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7fc">
<title>AtcivPerson · Панель</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light dark;--bg:var(--tg-theme-bg-color,#f4f7fc);--surface:var(--tg-theme-section-bg-color,var(--tg-theme-secondary-bg-color,#fff));--surface2:var(--tg-theme-secondary-bg-color,#f7f9fd);--text:var(--tg-theme-text-color,#18243a);--muted:var(--tg-theme-hint-color,#71809a);--line:var(--tg-theme-section-separator-color,#e7edf5);--blue:var(--tg-theme-button-color,#3978e8);--blue-soft:var(--tg-theme-secondary-bg-color,#eaf1ff);--input-bg:var(--tg-theme-bg-color,#fff);--label:var(--tg-theme-subtitle-text-color,#53627b);--bottom-bg:var(--tg-theme-secondary-bg-color,#ffffffed);--nav-muted:var(--tg-theme-hint-color,#8793a8);--notice-bg:var(--tg-theme-secondary-bg-color,#eef4ff);--notice-line:var(--tg-theme-section-separator-color,#dce8ff);--notice-text:var(--tg-theme-hint-color,#45628e);--danger-bg:var(--tg-theme-secondary-bg-color,#fff0f1);--green:#16865d;--red:var(--tg-theme-destructive-text-color,#cf4c57);--shadow:0 8px 28px rgba(35,57,94,.055);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:14px;padding-bottom:calc(82px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:0 auto;min-height:100vh}.top{padding:calc(16px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.3px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#76a9ff,#3978e8);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:0 5px 14px #3978e833}.top small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:800}
main{padding:8px 16px 22px}.page-title{font-size:25px;letter-spacing:-.8px;margin:8px 2px 5px;font-weight:800}.subtitle{color:var(--muted);margin:0 2px 18px;line-height:1.45}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat,.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:15px;min-height:94px}.stat .n{font-size:26px;font-weight:800;letter-spacing:-.8px}.stat .k{font-size:12px;color:var(--muted);margin-top:4px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section-head h2{font-size:15px;margin:0;font-weight:750}.link{color:var(--blue);font-size:12px;font-weight:700;border:0;background:none;padding:6px}.card{padding:14px;margin-bottom:10px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.name{font-weight:750;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:12px;line-height:1.45}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted)}.pill.ok{background:var(--tg-theme-secondary-bg-color,#e8f7f0);color:var(--green)}.pill.off{background:#f1f3f7;color:#788398}.pill.warn{background:var(--input-bg)4e5;color:#a96a13}.btn{border:0;border-radius:12px;background:var(--blue);color:white;padding:10px 14px;font-weight:700;font-size:12px}.btn.soft{background:var(--blue-soft);color:var(--blue)}.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--input-bg)0f1;color:var(--red)}.btn.small{padding:8px 10px}.btn:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700;color:var(--label)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--input-bg);padding:11px 12px;color:var(--text);outline:none}.field textarea{min-height:86px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#8eb3fa;box-shadow:0 0 0 3px #3978e815}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--input-bg);border-radius:999px;padding:9px 13px;color:var(--muted);font-size:12px;font-weight:700}.tab.active{background:var(--blue);border-color:var(--blue);color:white}.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed #d9e2ef;border-radius:18px}.empty b{display:block;color:var(--text);margin-bottom:5px}.bottom{position:fixed;z-index:5;bottom:0;left:0;right:0;background:var(--input-bg)fffed;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav{width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.nav button{border:0;background:transparent;color:var(--nav-muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:10px;font-weight:700}.nav button .ico{font-size:19px;line-height:22px}.nav button.active{color:var(--blue)}.notice{padding:12px 14px;background:var(--notice-bg);border:1px solid var(--notice-line);color:var(--notice-text);border-radius:14px;font-size:12px;line-height:1.5;margin:12px 0}.searchbar{display:flex;gap:8px}.searchbar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--input-bg)}.result{padding:13px 0;border-bottom:1px solid var(--line)}.result:last-child{border:0}.range{width:100%;accent-color:var(--blue)}.setting{padding:13px 0;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.setting-head{display:flex;justify-content:space-between;gap:10px;font-weight:700}.setting-head output{color:var(--blue)}dialog{width:min(560px,calc(100% - 24px));border:0;border-radius:22px;padding:0;box-shadow:0 24px 90px #14233e55;max-height:88vh}dialog::backdrop{background:#14233e66;backdrop-filter:blur(3px)}.modal{padding:18px;overflow:auto;max-height:88vh}.modal h3{margin:0 0 4px;font-size:19px}.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.toast{position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));background:#1d2c45;color:#fff;border-radius:12px;padding:11px 15px;box-shadow:var(--shadow);max-width:90%;font-size:12px}.spinner{width:18px;height:18px;border:2px solid #d9e5f8;border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:600px){main{padding:14px 22px 30px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.top{padding-left:24px;padding-right:24px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">A</div><div>AtcivPerson<small>Панель управления</small></div></div><div class="avatar" id="user-avatar">A</div></header>
<main id="content"><div class="empty"><div class="spinner"></div><p>Подключаем панель…</p></div></main>
</div>
<div class="bottom"><nav class="nav" id="nav">
<button data-page="home" class="active"><span class="ico">⌂</span>Главная</button>
<button data-page="accounts"><span class="ico">♙</span>Аккаунты</button>
<button data-page="ai"><span class="ico">✳</span>ИИ</button>
<button data-page="tools"><span class="ico">⌕</span>Инструменты</button>
<button data-page="settings"><span class="ico">⚙</span>Ещё</button>
</nav></div>
<dialog id="dialog"><div class="modal" id="modal"></div></dialog>
<script>
(() => {
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('bg_color');tg.setBackgroundColor('bg_color');tg.setBottomBarColor('bottom_bar_bg_color')}catch{}}
const initData=tg?.initData||'';
const $=s=>document.querySelector(s), content=$('#content'), dialog=$('#dialog'), modal=$('#modal');
const state={page:'home',aiTab:'agents',toolTab:'groups',accounts:[],agents:[],personas:[],examples:[],triggers:[],settings:{},logs:[],logDestinations:{},modulePolicies:{},campaigns:[],schedules:[],reactions:[],parserResult:null,bindings:{groups:[],channels:[]},searchResults:[],searchKind:'groups',parserKind:'participants',parserAccountId:null,parserData:null,busy:false};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=msg=>{let n=document.createElement('div');n.className='toast';n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),2600)};
async function api(path,opts={}){const res=await fetch('/v1/miniapp'+path,{...opts,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData,...opts.headers}});let data;try{data=await res.json()}catch{data={}}if(!res.ok)throw new Error(data.detail||'Ошибка запроса');return data}
const json=(method,body)=>({method,body:JSON.stringify(body)});
async function loadAll(){if(!initData){content.innerHTML='<div class="empty"><b>Откройте через Telegram</b>Для защиты панели авторизация доступна только через кнопку Mini App в боте.</div>';return}
try{const [accounts,agents,personas,examples,triggers,settings,logs,logDestinations,modulePolicies,bindings,campaigns,schedules,reactions]=await Promise.all(['accounts','agents','personas','examples','triggers','settings','logs','logs/destinations','module-policies','bindings','campaigns','schedules','reactions'].map(p=>api('/'+p)));Object.assign(state,{accounts,agents,personas,examples,triggers,settings,logs,logDestinations,modulePolicies,bindings,campaigns,schedules,reactions});const u=JSON.parse(new URLSearchParams(initData).get('user')||'{}');$('#user-avatar').textContent=(u.first_name||'A').slice(0,1).toUpperCase();render()}catch(e){content.innerHTML='<div class="empty"><b>Не удалось загрузить панель</b>'+esc(e.message)+'<div class="actions" style="justify-content:center"><button class="btn" id="retry">Повторить</button></div></div>';$('#retry')?.addEventListener('click',loadAll)}}
function pageHead(title,sub){return '<h1 class="page-title">'+title+'</h1><p class="subtitle">'+sub+'</p>'}
function empty(title,desc){return '<div class="empty"><b>'+title+'</b>'+desc+'</div>'}
function accountLabel(a){return esc(a.display_name||a.username||('Аккаунт #'+a.id))+' · #'+a.id}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));({home:renderHome,accounts:renderAccounts,ai:renderAI,tools:renderTools,settings:renderSettings})[state.page]()}
function renderHome(){const active=state.accounts.filter(a=>a.enabled&&!a.manual_pause).length;content.innerHTML=pageHead('Всё под контролем','Аккаунты, ИИ и автоматизация — в одном месте.')+
'<div class="grid"><div class="stat"><div class="n">'+state.accounts.length+'</div><div class="k">Аккаунты</div></div><div class="stat"><div class="n">'+active+'</div><div class="k">Активны</div></div><div class="stat"><div class="n">'+state.agents.length+'</div><div class="k">ИИ-агенты</div></div><div class="stat"><div class="n">'+state.triggers.filter(t=>t.enabled).length+'</div><div class="k">Активные триггеры</div></div></div>'+
'<div class="section-head"><h2>Быстрый доступ</h2></div><div class="grid">'+[['accounts','♙','Аккаунты'],['ai','✳','ИИ-агенты'],['tools','⌕','Поиск групп и каналов'],['tools','◎','Глобальные триггеры']].map(x=>'<button class="card" data-go="'+x[0]+'" style="text-align:left;border:1px solid var(--line);color:var(--text)"><div style="font-size:22px;color:var(--blue);margin-bottom:9px">'+x[1]+'</div><b>'+x[2]+'</b></button>').join('')+'</div>'+
'<div class="section-head"><h2>Последние события</h2><button class="link" data-go="settings" data-sub="logs">Все логи</button></div>'+state.logs.slice(0,4).map(logCard).join('')||empty('Пока нет событий','Здесь появится история действий и изменений.');
}
function renderAccounts(){content.innerHTML=pageHead('Аккаунты','Управляйте подключениями и назначайте каждому аккаунту своего ИИ-агента и персону.')+
(state.accounts.length?state.accounts.map(a=>'<article class="card"><div class="row between"><div class="grow"><div class="name">'+accountLabel(a)+'</div><div class="muted">'+(a.username?'@'+esc(a.username)+' · ':'')+'Telegram ID '+a.telegram_user_id+'</div></div><span class="pill '+(a.connection_status==='connected'?'ok':'off')+'">'+esc(a.connection_status==='connected'?'Подключён':a.connection_status)+'</span></div><div class="row between" style="margin-top:12px"><span class="muted">'+(a.enabled?'Включён':'Отключён')+' · '+(a.manual_pause?'На паузе':'Работает')+'</span><span class="pill '+(a.ai_enabled?'ok':'off')+'">'+(a.ai_enabled?'ИИ включён':'ИИ выключен')+'</span></div><div class="two" style="margin-top:12px"><div class="field" style="margin:0"><label>ИИ-агент</label><select data-account="'+a.id+'" data-field="ai_agent_id"><option value="">Не выбран</option>'+state.agents.map(x=>'<option value="'+x.id+'" '+(a.ai_agent_id===x.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div><div class="field" style="margin:0"><label>Персона</label><select data-account="'+a.id+'" data-field="persona_id"><option value="">Не выбрана</option>'+state.personas.map(x=>'<option value="'+x.id+'" '+(a.persona_id===x.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div></div><div class="field" style="margin-top:10px"><label>Режим ответов</label><select data-account="'+a.id+'" data-field="reply_mode"><option value="manual" '+(a.reply_mode==='manual'?'selected':'')+'>Ручной режим · черновики</option><option value="automatic" '+(a.reply_mode==='automatic'?'selected':'')+'>Автоматические ответы</option></select></div><div class="actions"><button class="btn soft small" data-account-action="ai" data-id="'+a.id+'">'+(a.ai_enabled?'Выключить ИИ':'Включить ИИ')+'</button><button class="btn ghost small" data-account-action="pause" data-id="'+a.id+'">'+(a.manual_pause?'Снять паузу':'Пауза')+'</button><button class="btn ghost small" data-account-action="enabled" data-id="'+a.id+'">'+(a.enabled?'Отключить':'Включить')+'</button></div></article>').join(''):empty('Аккаунтов пока нет','Подключённые аккаунты появятся здесь.'))}
function renderAI(){content.innerHTML=pageHead('Искусственный интеллект','Агенты, персоны и примеры — раздельно и с понятными связями.')+'<div class="tabs"><button class="tab '+(state.aiTab==='agents'?'active':'')+'" data-ai-tab="agents">Агенты</button><button class="tab '+(state.aiTab==='personas'?'active':'')+'" data-ai-tab="personas">Персоны</button><button class="tab '+(state.aiTab==='examples'?'active':'')+'" data-ai-tab="examples">Примеры</button></div>'+({agents:agentsView,personas:personasView,examples:examplesView})[state.aiTab]()}
function agentsView(){return '<div class="section-head"><h2>ИИ-агенты</h2><button class="btn small" data-action="agent-new">＋ Создать</button></div>'+(state.agents.length?state.agents.map(a=>'<article class="card"><div class="row between"><div class="grow"><div class="name">'+esc(a.name)+'</div><div class="muted">'+esc(a.model)+' · '+esc(a.base_url)+'</div></div><span class="pill '+(a.enabled?'ok':'off')+'">'+(a.enabled?'Активен':'Выключен')+'</span></div><div class="muted" style="margin-top:8px">'+(a.is_default?'Агент по умолчанию · ':'')+(a.has_api_key?'Ключ сохранён':'API-ключ не задан')+'</div><div class="actions"><button class="btn soft small" data-action="agent-edit" data-id="'+a.id+'">Настроить</button><button class="btn danger small" data-action="agent-delete" data-id="'+a.id+'">Удалить</button></div></article>').join(''):empty('Нет ИИ-агентов','Создайте агента и укажите провайдера и модель.'))}
function personasView(){return '<div class="section-head"><h2>Персоны</h2><button class="btn small" data-action="persona-new">＋ Создать</button></div>'+(state.personas.length?state.personas.map(p=>'<article class="card"><div class="row between"><div class="name">'+esc(p.name)+'</div><button class="link" data-action="persona-edit" data-id="'+p.id+'">Изменить</button></div><div class="muted" style="margin-top:6px">'+esc(p.description||'Без описания')+'</div><div class="muted" style="margin-top:8px">'+esc(p.style_instructions).slice(0,240)+'</div></article>').join(''):empty('Персон пока нет','Персона задаёт характер и стиль ответов ИИ.'))}
function examplesView(){return '<div class="section-head"><h2>Примеры общения</h2><button class="btn small" data-action="example-new">＋ Добавить</button></div><div class="notice">Добавляйте только примеры, которые разрешено использовать. Перед сохранением удаляйте персональные данные.</div>'+(state.examples.length?state.examples.map(e=>'<article class="card"><div class="row between"><div class="name">'+esc(e.title||'Пример #'+e.id)+'</div><button class="btn danger small" data-action="example-delete" data-id="'+e.id+'">Удалить</button></div><div class="muted" style="margin-top:8px">Входящее сообщение</div><div>'+esc(e.incoming_text).slice(0,260)+'</div><div class="muted" style="margin-top:8px">Предпочтительный ответ</div><div>'+esc(e.preferred_reply).slice(0,260)+'</div></article>').join(''):empty('Примеров пока нет','Добавьте пары «сообщение → желаемый ответ».'))}
function renderTools(){content.innerHTML=pageHead('Инструменты','Поиск площадок и управление условиями срабатывания.')+'<div class="tabs"><button class="tab '+(state.toolTab==='groups'?'active':'')+'" data-tool-tab="groups">Поиск групп</button><button class="tab '+(state.toolTab==='channels'?'active':'')+'" data-tool-tab="channels">Поиск каналов</button><button class="tab '+(state.toolTab==='triggers'?'active':'')+'" data-tool-tab="triggers">Триггеры</button><button class="tab '+(state.toolTab==='bindings'?'active':'')+'" data-tool-tab="bindings">Мои площадки</button><button class="tab '+(state.toolTab==='modules'?'active':'')+'" data-tool-tab="modules">Модули</button><button class="tab '+(state.toolTab==='parser'?'active':'')+'" data-tool-tab="parser">Парсер</button><button class="tab '+(state.toolTab==='tasks'?'active':'')+'" data-tool-tab="tasks">Очередь задач</button></div>'+({groups:searchView,channels:searchView,triggers:triggersView,bindings:bindingsView,modules:modulesView,parser:parserView,tasks:tasksView})[state.toolTab]()}
function searchView(){const kind=state.toolTab;return '<div class="card"><div class="field"><label>Аккаунт для поиска</label><select id="search-account">'+state.accounts.map(a=>'<option value="'+a.id+'">'+accountLabel(a)+'</option>').join('')+'</select></div><div class="field"><label>Что ищем?</label><div class="searchbar"><input id="search-query" placeholder="Например: маркетинг, дизайн, путешествия"><button class="btn" id="search-run">Найти</button></div></div><div class="muted">Результаты проверяются через Telegram. Добавление в список не означает автоматического вступления или подписки.</div></div><div id="search-results">'+(state.searchResults.length?state.searchResults.map(searchResult).join(''):empty('Начните поиск','Введите тему и выберите аккаунт.'))+'</div>'}
function searchResult(r){const add=(r.id!==null&&r.id!==undefined)?'<button class="btn soft small" data-save-result="'+encodeURIComponent(JSON.stringify(r))+'">Добавить в мой список</button>':'<span class="pill off">Нет ID для привязки</span>';return '<div class="result"><div class="row between"><div class="grow"><div class="name">'+esc(r.title)+'</div><div class="muted">'+Number(r.members||0).toLocaleString('ru-RU')+' участников · '+esc(r.source||'Telegram')+'</div></div><span class="pill '+(r.verified?'ok':'warn')+'">'+(r.verified?'Проверено':'Не проверено')+'</span></div><div class="muted" style="margin-top:5px">'+esc(r.link)+'</div><div class="actions">'+add+'<button class="btn ghost small" data-copy="'+esc(r.link)+'">Копировать ссылку</button></div></div>'}

async function loadParserSettings(){if(!state.parserAccountId)return;try{state.parserData=await api('/parser-settings/'+state.parserAccountId+'/'+state.parserKind);state.parserResult=null;render()}catch(e){toast(e.message)}}
async function runParser(){const target=content.querySelector('[data-parser-target]')?.value?.trim();if(!target){toast('Укажите целевую группу или канал');return}const btn=content.querySelector('[data-parser-run]');btn.disabled=true;btn.textContent='Выполняется…';try{const values={};content.querySelectorAll('[data-parser-field]').forEach(x=>values[x.dataset.parserField]=x.type==='checkbox'?x.checked:x.dataset.parserField==='keywords'?x.value:Number(x.value));state.parserData=await api('/parser-settings/'+state.parserAccountId+'/'+state.parserKind,json('PUT',{values}));state.parserResult=await api('/parser/run/'+state.parserAccountId+'/'+state.parserKind,json('POST',{target}));render();toast('Парсер завершил работу')}catch(e){toast(e.message);btn.disabled=false;btn.textContent='Запустить парсер'}}
function exportParserCsv(){if(!state.parserResult?.items?.length)return;const rows=state.parserResult.items;const keys=[...new Set(rows.flatMap(x=>Object.keys(x)))];const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[keys.map(quote).join(';'),...rows.map(row=>keys.map(k=>quote(typeof row[k]==='object'?JSON.stringify(row[k]):row[k])).join(';'))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='atciv-parser-'+state.parserKind+'-'+state.parserAccountId+'.csv';document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url)}
async function refreshPage(){const [accounts,agents,personas,examples,triggers,settings,logs,logDestinations,modulePolicies,bindings,campaigns,schedules,reactions]=await Promise.all(['accounts','agents','personas','examples','triggers','settings','logs','logs/destinations','module-policies','bindings','campaigns','schedules','reactions'].map(p=>api('/'+p)));Object.assign(state,{accounts,agents,personas,examples,triggers,settings,logs,logDestinations,modulePolicies,bindings,campaigns,schedules,reactions});render()}
